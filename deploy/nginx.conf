# Cloudflare Tunnel(cloudflared) → nginx:80 → app:8000
# TLS는 Cloudflare 엣지에서 끝나고, 여기로는 http로 들어온다.

# www는 루트 도메인으로 (쿠키가 호스트별이라 한 주소로 통일)
server {
    listen 80;
    server_name www.gloria-homework.site;
    return 301 https://gloria-homework.site$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    # 수업 사진 최대 10장 x 25MB (+ multipart 여유), 녹음 변환 30MB
    client_max_body_size 260m;

    # app이 아직 안 떠 있어도 nginx는 뜨도록 요청 시점에 이름을 찾는다
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:8000;

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
