# 독립 스택: Cloudflare Tunnel → nginx → app. 호스트 포트는 열지 않는다.
# 같은 폴더의 .env를 앱 환경변수(env_file)와 TUNNEL_TOKEN·DOCKERHUB_USERNAME 치환에 함께 쓴다.
# 터널 라우트(Cloudflare 대시보드): gloria-homework.site, www.gloria-homework.site → http://nginx:80

name: english-homework

# 도커 로그 상한 (기본 json-file은 무제한). 앱 로그는 data/logs/app.log에도 따로 남는다.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *logging
    image: ${DOCKERHUB_USERNAME}/do-your-english-homework:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Seoul
    volumes:
      # SQLite DB + 업로드한 수업 사진
      - ./data:/code/data

  nginx:
    <<: *logging
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      # bind mount는 설정 해시에 반영되지 않으므로 nginx.conf를 수정하면, 컨테이너를 수동으로 재시작해야 반영된다.
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  tunnel:
    <<: *logging
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - nginx
